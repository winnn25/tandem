<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tandem: crew and cabin health checks</title>
<meta name="description" content="Tandem helps astronauts spot health changes early by reading their body, their crewmate's view and their cabin's microbes together. NASA Space Apps 2026.">
<style>
:root{
  --bg1:#F5F8FC; --bg2:#E2E8F7; --mist:#E7ECF2;
  --surface:rgba(255,255,255,.74); --glass:rgba(255,255,255,.7); --raised:#fff; --bar-bg:rgba(255,255,255,.82); --sheet:#F7F9FC;
  --ink:#132235; --ink2:#4A5B70; --ink3:#5B6B80; --inkrgb:19,34,53; --sh:19,34,53;
  --fill:#132235; --on-fill:#fff;
  --good:#0F7151; --watch:#8A5600; --act:#B3261E;
  --good-bg:#E3F4EC; --watch-bg:#FBF0DC; --act-bg:#FBE5E3;
  --immune:#6B4EE6; --bone:#C97A1E; --heart:#D23F70; --mind:#178FA8; --fuel:#7A8B00; --immune-soft:#B7A8F5;
  --link:#2C49C9; --focus:#6E86F0;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
  --shadow:0 1px 2px rgba(var(--sh),.04), 0 8px 24px rgba(var(--sh),.06);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg1:#1A2333; --bg2:#1D2443; --mist:#0E141D;
  --surface:rgba(28,37,51,.78); --glass:rgba(255,255,255,.06); --raised:#1F2938; --bar-bg:rgba(22,30,42,.88); --sheet:#151D29;
  --ink:#E8EDF5; --ink2:#AAB6C7; --ink3:#8794A8; --inkrgb:232,237,245; --sh:0,0,0;
  --fill:#E8EDF5; --on-fill:#101722;
  --good:#3CC48F; --watch:#E3A645; --act:#F58A80;
  --good-bg:rgba(60,196,143,.15); --watch-bg:rgba(227,166,69,.15); --act-bg:rgba(242,118,107,.16);
  --immune:#8C78F0; --bone:#C9842A; --heart:#DD5A84; --mind:#2A9DB5; --fuel:#869A22; --immune-soft:#4E4390;
  --link:#9DB0FF; --focus:#8EA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%,var(--bg1) 0%,transparent 60%),
  radial-gradient(900px 500px at 110% 10%,var(--bg2) 0%,transparent 55%),var(--mist);
  background-attachment:fixed;min-height:100vh;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:70;background:var(--fill);color:var(--on-fill);padding:10px 14px;border-radius:12px;font-weight:600;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}
main{min-width:0}
/* header */
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}
.mission{font-size:13px;color:var(--ink2);background:var(--surface);border:1px solid rgba(var(--inkrgb),.08);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .35s var(--spring)}
.mission:active,.iconbtn:active{transform:scale(.93)}
.iconbtn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid rgba(var(--inkrgb),.08);cursor:pointer;color:var(--ink);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .35s var(--spring),background .3s}
.iconbtn svg{transition:transform .5s var(--spring)}
.crewrow{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.crew{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1}
.crew::-webkit-scrollbar{display:none}
.chipcrew{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid rgba(var(--inkrgb),.08);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .35s var(--spring),background .25s,color .25s}
.chipcrew:active{transform:scale(.95)}
.chipcrew[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* cards */
.card{background:var(--surface);border:1px solid var(--glass);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);margin-bottom:14px;transition:box-shadow .3s}
.card h2{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.card h3{font-size:15px;font-weight:650;margin-bottom:2px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* hero */
.hero{padding:20px 18px 18px}
.hero-top{display:flex;gap:16px;align-items:center}
.rings{flex:none;width:150px;height:150px}
.rings circle{fill:none;stroke-linecap:round}
.ring-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.headline{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:14px;font-size:13px}
.legend button{display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:4px 0;text-align:left}
.legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.why{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:rgba(var(--inkrgb),.05);font-size:14px}
/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-good{background:var(--good-bg);color:var(--good)}
.s-watch{background:var(--watch-bg);color:var(--watch)}
.s-act{background:var(--act-bg);color:var(--act)}
/* buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .4s var(--spring),box-shadow .3s ease,background-color .2s ease,opacity .2s;will-change:transform;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--fill);color:var(--on-fill);box-shadow:0 6px 18px rgba(var(--sh),.22)}
.btn-soft{background:var(--raised);color:var(--ink);border:1px solid rgba(var(--inkrgb),.08);box-shadow:0 1px 2px rgba(var(--sh),.05)}
.btn-ghost{background:transparent;color:var(--ink2);padding:10px 14px}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:14px}
@media (hover:hover) and (pointer:fine){
  .btn:hover,.iconbtn:hover,.mission:hover{transform:translateY(-1px)}
  .btn-primary:hover{box-shadow:0 10px 26px rgba(var(--sh),.28)}
  .btn-soft:hover{box-shadow:0 6px 16px rgba(var(--sh),.1)}
  .btn:active,.iconbtn:active{transform:scale(.96)}
  .chipcrew:hover,.seg button:hover,.tag:hover,.station button:hover{border-color:rgba(var(--inkrgb),.22)}
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
/* segmented */
.seg{display:flex;background:rgba(var(--inkrgb),.07);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:1px solid transparent;background:transparent;border-radius:999px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,transform .35s var(--spring)}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 2px 8px rgba(var(--sh),.14)}
/* fields */
.field{padding:12px 0;border-top:1px solid rgba(var(--inkrgb),.08)}
.field:first-of-type{border-top:0}
.field label,.flabel{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.field label output{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--fill) var(--p,50%),rgba(var(--inkrgb),.14) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.1);transition:transform .3s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(var(--inkrgb),.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid rgba(var(--inkrgb),.1);background:var(--raised);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;transition:transform .35s var(--spring),background .2s,color .2s}
.tag:active{transform:scale(.95)}
.tag[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.faces{display:flex;gap:6px}
.faces button{flex:1;border:1px solid rgba(var(--inkrgb),.1);background:var(--raised);border-radius:14px;padding:10px 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);transition:transform .35s var(--spring),background .2s}
.faces button:active{transform:scale(.94)}
.faces button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
/* lists */
.list{list-style:none}
.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(var(--inkrgb),.08)}
.list li:first-child{border-top:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid rgba(var(--inkrgb),.22);flex:none;display:grid;place-items:center;cursor:pointer;background:var(--raised);transition:background .2s,border-color .2s,transform .35s var(--spring)}
.check:active{transform:scale(.9)}
.check[aria-checked="true"],.check.on{background:var(--good);border-color:var(--good)}
.check[aria-checked="true"]::after,.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sys{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;background:none;border:0;text-align:left;padding:0}
.sys .score{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:46px}
.bar{height:8px;border-radius:8px;background:rgba(var(--inkrgb),.09);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px}
.reason{display:flex;gap:10px;font-size:14px;padding:8px 0}
.reason .dot{margin-top:7px}
.science{font-size:13px;color:var(--ink2);background:rgba(var(--inkrgb),.05);border-radius:12px;padding:10px 12px;margin-top:8px}
.field output{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.flabel label{display:inline;margin:0}
.flabel .grow{margin-left:auto}
.info{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid rgba(var(--inkrgb),.25);background:var(--raised);color:var(--ink2);font-size:12px;font-weight:700;line-height:1;cursor:pointer;margin-left:8px;transition:transform .35s var(--spring)}
.info:active{transform:scale(.9)}
.tile{background:rgba(var(--inkrgb),.05);border-radius:14px;padding:10px 12px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:14px;border:1px solid rgba(var(--inkrgb),.12);display:block}
#f-photo:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.figure{flex:none;width:112px;height:auto}
.part{cursor:pointer;outline-offset:3px}
.part *{fill-opacity:.3;stroke-width:2;transition:fill-opacity .2s}
.part.aura *{fill-opacity:.1;stroke-dasharray:5 5}
.part:hover *,.part:focus-visible *{fill-opacity:.55}
.part.aura:hover *,.part.aura:focus-visible *{fill-opacity:.2}
.maprow{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 0;cursor:pointer;text-align:left;font-size:14px;font-weight:600;border-top:1px solid rgba(var(--inkrgb),.08)}
.maprow:first-child{border-top:0}
.maprow .pill{margin-left:auto}
.guide dt{font-size:13px;font-weight:600;color:var(--ink2);margin-top:14px}
.guide dd{font-size:15px;margin-top:2px}
/* station strip */
.station{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin-top:12px}
.station::-webkit-scrollbar{display:none}
.station button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid rgba(var(--inkrgb),.1);background:var(--raised);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .35s var(--spring),background .2s,color .2s}
.station button:active{transform:scale(.95)}
.station button[aria-pressed="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
/* trend chart */
.trend{position:relative;margin-top:12px}
.trend svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--fill);color:var(--on-fill);font-size:12px;font-weight:600;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 4px;border-top:1px solid rgba(var(--inkrgb),.08)}
.tbl th{color:var(--ink2);font-weight:600}
/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(448px,calc(100% - 24px));display:flex;justify-content:space-around;padding:6px;border-radius:999px;background:var(--bar-bg);border:1px solid var(--glass);box-shadow:0 10px 30px rgba(var(--sh),.16);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);z-index:20}
.tabbar button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:background .25s,color .25s,transform .35s var(--spring)}
.tabbar button:active{transform:scale(.92)}
.tabbar button[aria-current="page"]{color:var(--ink);background:rgba(var(--inkrgb),.08)}
.tabbar svg{width:22px;height:22px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--sheet);border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.22,1,.36,1);z-index:50;box-shadow:0 -10px 40px rgba(var(--sh),.2);visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.grab{width:40px;height:5px;border-radius:5px;background:rgba(var(--inkrgb),.2);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,24px);opacity:0;background:var(--fill);color:var(--on-fill);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;z-index:60;transition:transform .45s var(--spring),opacity .25s;box-shadow:0 8px 24px rgba(var(--sh),.3);pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
/* tour */
.tour{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,20px);width:min(448px,calc(100% - 24px));background:var(--fill);color:var(--on-fill);border-radius:24px;padding:16px 18px;z-index:45;box-shadow:0 14px 40px rgba(var(--sh),.35);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.tour.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.tour p{font-size:15px;line-height:1.4}
.tour .row{margin-top:12px}
.tour .btn-sm{padding:8px 14px}
.tour .tbtn{background:var(--on-fill);color:var(--fill)}
.tour .tghost{background:transparent;color:var(--on-fill);opacity:.75}
.spot{box-shadow:0 0 0 3px var(--focus),var(--shadow)!important;scroll-margin:90px}
.gap{border:1px solid rgba(201,58,49,.22);background:linear-gradient(180deg,var(--act-bg),var(--surface))}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
.chart{width:100%;height:auto;display:block}
.section-title{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 4px 8px}
textarea{width:100%;min-height:80px;border-radius:14px;border:1px solid rgba(var(--inkrgb),.1);background:var(--raised);padding:10px 12px;resize:vertical}
select{width:100%;border-radius:14px;border:1px solid rgba(var(--inkrgb),.1);background:var(--raised);padding:10px 12px}
.welcome-mark{display:flex;justify-content:center;margin:6px 0 14px}
.points{list-style:none;margin:14px 0}
.points li{display:flex;gap:12px;padding:8px 0;font-size:15px}
.points .dot{width:10px;height:10px;margin-top:6px}
@media (max-width:370px){.mission{padding:7px 9px;font-size:12px}.brand{font-size:16px}.headline{font-size:20px}.rings{width:118px;height:118px}.hero-top{gap:12px}.seg button{font-size:12px;padding:8px 3px}.figure{width:92px}}
@media (max-width:340px){.legend{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}.top{gap:6px}.iconbtn{width:34px;height:34px}}
@media (min-width:600px) and (max-width:999px){.app{max-width:640px}.tabbar{width:min(560px,calc(100% - 24px))}}
@media (max-height:480px) and (orientation:landscape){.tabbar button span{display:none}.tabbar button{padding:8px 0}.toast,.tour{bottom:72px}}
@media (min-width:1000px){
  .app{max-width:1040px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
  .side{position:sticky;top:16px}
  .top,.crewrow{grid-column:1/-1}
  .tabbar{position:sticky;transform:none;left:auto;bottom:auto;width:auto;flex-direction:column;border-radius:var(--r-xl);padding:8px;gap:2px}
  .tabbar button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:12px 14px;border-radius:16px}
  .toast{bottom:28px}
  .tour{left:auto;right:24px;bottom:24px;transform:translateY(20px);width:380px}
  .tour.on{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main" data-act="skip">Skip to content</a>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="10" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="13" r="8" fill="none" style="stroke:var(--immune)" stroke-width="2.4"/></svg>
      Tandem
    </div>
    <button class="mission" id="missionBtn" data-act="mission" aria-label="Change mission profile"></button>
    <button class="iconbtn" id="themeBtn" data-act="theme"></button>
    <button class="iconbtn" data-act="sources" aria-label="NASA data, sources and about">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>

/* ---------- utilities ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))||1};
const fmtTime=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const crewById=id=>CREW.find(c=>c.id===id);
const checkerOf=id=>CREW.find(x=>x.buddy===id);

/* ---------- simulated data (clearly labelled in the UI) ---------- */
const TODAY=96;
const TABS_IDS=['today','checkin','body','habitat','log'];
function genHistory(ci){
  const r=rng(1000+ci*77);
  const base={hr:[58,62,55][ci],hrv:[62,54,70][ci],sys:[114,120,110][ci]};
  const hist=[];
  for(let d=TODAY-13;d<=TODAY;d++){
    const n=()=>(r()-.5)*2;
    hist.push({day:d,hr:Math.round(base.hr+n()*3),hrv:Math.round(base.hrv+n()*6),sys:Math.round(base.sys+n()*5),spo2:Math.round(97+n()),
      temp:+(36.6+n()*.2).toFixed(1),sleep:+(7.3+n()*.6).toFixed(1),mood:r()>.25?4:5,stress:r()>.3?2:3,aer:Math.round(40+n()*10),res:Math.round(75+n()*12),
      vitd:true,glucose:Math.round(92+n()*6),meals:3,water:+(2.4+n()*.3).toFixed(1),photo:null,symptoms:[],dose:+(MISSIONS.iss.dose+n()*.05).toFixed(2),self:4,peer:null,done:d<TODAY});
  }
  return hist;
}
function freshModules(){const m={};MODULES.forEach((k,i)=>m[k]={viable:1,amr:'stable',diversity:'typical',lastSwab:TODAY-(i*2+1)});return m}
function freshState(){
  return {v:VERSION,tab:'today',crew:'aina',mission:'iss',theme:null,seenIntro:false,metric:'hr',showTable:false,
    hist:Object.fromEntries(CREW.map((c,i)=>[c.id,genHistory(i)])),
    hab:{selected:'Node 3',co2:2.6,modules:freshModules()},
    log:[],steps:{},scenario:'nominal'};
}
let S;
try{S=JSON.parse(localStorage.getItem(STORE))}catch(e){S=null}
function valid(x){try{return x&&x.v===VERSION&&CREW.every(c=>Array.isArray(x.hist[c.id])&&x.hist[c.id].length===14)&&MODULES.every(k=>x.hab.modules[k])&&CREW.some(c=>c.id===x.crew)&&MISSIONS[x.mission]&&TABS_IDS.includes(x.tab)&&Array.isArray(x.log)&&x.steps&&typeof x.steps==='object'}catch(e){return false}}
if(!valid(S))S=freshState();
if(!METRICS[S.metric])S.metric='hr';
function capLog(){if(S.log.length>200)S.log=S.log.slice(-200);let n=0;for(let i=S.log.length-1;i>=0;i--){if(S.log[i].photo&&++n>4)S.log[i].photo=null}}
function save(){capLog();try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}

/* ---------- the model ---------- */
// Habitat risk per module, 0-100. Weights are demo parameters modelled on the OSD-224 study design.
function modIndex(m){return clamp(([0,22,45,70][m.viable]||0)+(m.amr==='rising'?20:0)+(m.diversity==='lower'?10:0),0,100)}
function habWorst(h){let best=null;MODULES.forEach(k=>{const i=modIndex(h.modules[k]);if(!best||i>best.idx)best={module:k,idx:i}});return best}
function habLevel(i){return i>=65?'act':i>=40?'watch':'good'}
function swabDue(h){let o=null;MODULES.forEach(k=>{const age=TODAY-h.modules[k].lastSwab;if(!o||age>o.age)o={module:k,age}});return o}
function baseline(hist){
  const b=hist.slice(0,7);
  return {hr:mean(b.map(x=>x.hr)),hrSd:Math.max(sd(b.map(x=>x.hr)),2),hrv:mean(b.map(x=>x.hrv)),hrvSd:Math.max(sd(b.map(x=>x.hrv)),3),sys:mean(b.map(x=>x.sys))};
}
function status(score){return score>=80?'good':score>=60?'watch':'act'}
const STATUS_WORD={good:'Nominal',watch:'Watch',act:'Act now'};

function evaluate(crewId,entry,opts){
  opts=opts||{};
  const hist=S.hist[crewId], b=baseline(hist), hab=opts.hab||S.hab, mission=MISSIONS[S.mission];
  const R={immune:[],bone:[],heart:[],mind:[],fuel:[]};
  const add=(sys,sev,code,text)=>R[sys].push({sev,code,text});
  const dHr=entry.hr-b.hr, z=dHr/b.hrSd;
  if(dHr>=25)add('heart',45,'hr_high',`Resting heart rate is ${entry.hr} bpm, ${Math.round(dHr)} above your normal of ${Math.round(b.hr)}. That is a large jump.`);
  else if(dHr>=15||z>=3)add('heart',30,'hr_high',`Resting heart rate is ${entry.hr} bpm, ${Math.round(dHr)} above your normal of ${Math.round(b.hr)}.`);
  else if(dHr>=8)add('heart',12,'hr_high',`Resting heart rate is ${Math.round(dHr)} bpm above your normal.`);
  if(entry.hr<=42)add('heart',45,'hr_low',`Resting heart rate is very low at ${entry.hr} bpm.`);
  else if(entry.hr<=48&&dHr<=-8)add('heart',24,'hr_low',`Resting heart rate is ${entry.hr} bpm, ${Math.round(-dHr)} below your normal.`);
  const hrvDrop=(b.hrv-entry.hrv)/b.hrv;
  if(hrvDrop>=.3)add('heart',24,'hrv_low',`Heart rate variability is ${Math.round(hrvDrop*100)}% below your normal, a sign your body hasn't recovered.`);
  else if(hrvDrop>=.15)add('heart',10,'hrv_low',`Heart rate variability is ${Math.round(hrvDrop*100)}% below your normal.`);

  else if(entry.spo2<95)add('heart',15,'spo2_low',`Blood oxygen is ${entry.spo2}%, a little low.`);
  if(entry.sys<=90)add('heart',30,'bp_low',`Blood pressure is very low at ${entry.sys} systolic. Light-headedness and fainting are possible.`);
  else if(entry.sys<=98)add('heart',14,'bp_low',`Blood pressure is low at ${entry.sys} systolic, which can bring light-headedness.`);
  else if(entry.sys>=160)add('heart',45,'bp_high',`Blood pressure is very high at ${entry.sys} systolic.`);
  else if(entry.sys>=140)add('heart',22,'bp_high',`Blood pressure is high at ${entry.sys} systolic.`);
  if(entry.symptoms.includes('vision'))add('heart',30,'vision','You reported a vision change. Fluid shifting toward the head can change the eye on long missions.');
  if(entry.aer<20)add('heart',12,'aer_low',`Only ${entry.aer} minutes of aerobic exercise logged.`);
  if(entry.res<30)add('bone',35,'res_low',`Only ${entry.res} minutes of resistance exercise. Without load, bone thins fastest in the hips and spine.`);
  else if(entry.res<60)add('bone',15,'res_low',`${entry.res} minutes of resistance exercise, short of your 60-minute plan.`);
  if(entry.symptoms.includes('back'))add('bone',10,'back','You reported back pain.');
  if(!entry.vitd)add('bone',8,'vitd','Vitamin D not taken today.');
  if(entry.temp>=39)add('immune',50,'fever',`Temperature is ${entry.temp} °C, a high fever.`);
  else if(entry.temp>=38)add('immune',38,'fever',`Temperature is ${entry.temp} °C, a fever.`);
  else if(entry.temp>=37.5)add('immune',22,'fever',`Temperature is slightly raised at ${entry.temp} °C.`);
  else if(entry.temp<=35.8)add('immune',45,'cold',`Temperature is low at ${entry.temp} °C.`);
  const resp=['sore','cong'].filter(s=>entry.symptoms.includes(s)).length;
  if(resp)add('immune',12*resp,'resp',`You reported ${resp===2?'a sore throat and congestion':entry.symptoms.includes('sore')?'a sore throat':'congestion'}.`);
  if(entry.symptoms.includes('skin'))add('immune',10,'resp','You reported a skin rash.');
  if(entry.symptoms.includes('gi'))add('immune',8,'resp','You reported stomach upset. Gut microbes shift in spaceflight.');
  if(entry.symptoms.includes('fatigue'))add('immune',8,'resp','You reported unusual tiredness.');
  const w=habWorst(hab);
  if(w.idx>=65)add('immune',26,'hab_high',`${w.module} cabin microbes are well above the reference (habitat risk ${w.idx}). Your immune defences are already under strain in orbit.`);
  else if(w.idx>=40)add('immune',12,'hab_mod',`${w.module} cabin microbes are above the reference (habitat risk ${w.idx}).`);
  if(entry.dose>=mission.dose*3)add('immune',45,'dose',`Dosimeter reads ${entry.dose} mSv today, ${(entry.dose/mission.dose).toFixed(0)} times this mission's usual ${mission.dose}. Check for a solar particle event.`);
  else if(entry.dose>mission.dose*1.6)add('immune',22,'dose',`Dosimeter reads ${entry.dose} mSv today, well above this mission's usual ${mission.dose}.`);
  if(entry.sleep<6)add('immune',8,'sleep_low',`Short sleep (${entry.sleep} h) weakens immune defences.`);
  if(entry.mood===1)add('mind',45,'mood_low','You rated your mood very low today.');
  else if(entry.mood===2)add('mind',28,'mood_low','You rated your mood low today.');
  else if(entry.mood===3)add('mind',8,'mood_low','Mood is middling today.');
  if(entry.stress===5)add('mind',45,'stress_high','You rated your stress very high.');
  else if(entry.stress===4)add('mind',22,'stress_high','You rated your stress high.');
  if(entry.sleep<4)add('mind',45,'sleep_low',`You slept only ${entry.sleep} hours.`);
  else if(entry.sleep<6)add('mind',22,'sleep_low',`You slept ${entry.sleep} hours, under 6.`);
  else if(entry.sleep<7)add('mind',6,'sleep_low',`You slept ${entry.sleep} hours, a little short.`);
  const idx=hist.indexOf(entry); const prev=(idx>0?hist.slice(Math.max(0,idx-3),idx):[]);
  if(prev.length===3&&mean(prev.concat([entry]).map(x=>x.mood))<=2.75)add('mind',10,'mood_low','Your mood has been low for several days in a row.');

  if(entry.peer&&entry.peer.obs.filter(o=>o!=='fine').length){
    const o=entry.peer.obs.filter(o=>o!=='fine'), by=crewById(entry.peer.by).first;
    add('mind',o.length>=2?18:10,'peer',`${by} noticed: ${o.map(k=>PEER_OBS.find(p=>p[0]===k)[1].toLowerCase()).join(', ')}.`);
    if(o.includes('cough')||o.includes('pale'))add('immune',10,'resp',`${by} noticed you ${o.includes('cough')?'coughing':'looking pale or flushed'}.`);
  }
  if(entry.glucose<54)add('fuel',50,'glu_low',`Blood sugar is very low at ${entry.glucose} mg/dL.`);
  else if(entry.glucose<70)add('fuel',25,'glu_low',`Blood sugar is low at ${entry.glucose} mg/dL.`);
  else if(entry.glucose>180)add('fuel',45,'glu_high',`Blood sugar is high at ${entry.glucose} mg/dL.`);
  else if(entry.glucose>125)add('fuel',15,'glu_high',`Blood sugar is ${entry.glucose} mg/dL, above the usual fasting range.`);
  if(entry.meals<=0)add('fuel',45,'eat','No meals logged today.');
  else if(entry.meals===1)add('fuel',25,'eat','Only 1 of 3 meals logged today.');
  else if(entry.meals===2)add('fuel',8,'eat','2 of 3 meals logged today.');
  if(entry.water<1)add('fuel',45,'drink',`Only ${entry.water} L of water logged. Dehydration also strains the heart.`);
  else if(entry.water<1.8)add('fuel',22,'drink',`${entry.water} L of water logged, short of 2 L.`);
  const systems={};
  SYS.forEach(s=>{const reasons=R[s.id].sort((a,b)=>b.sev-a.sev);const score=clamp(100-reasons.reduce((t,r)=>t+r.sev,0),5,100);systems[s.id]={score,status:status(score),reasons}});
  const minScore=Math.min(...SYS.map(s=>systems[s.id].score));
  const overall=Math.round(minScore*.6+mean(SYS.map(s=>systems[s.id].score))*.4);
  const signalRating=clamp(Math.ceil(minScore/20),1,5);
  let top=null;
  SYS.forEach(s=>systems[s.id].reasons.forEach(r=>{if(!top||r.sev>top.sev)top={...r,sys:s.id}}));
  const worst=SYS.slice().sort((a,b)=>systems[a.id].score-systems[b.id].score)[0];
  return {systems,overall,status:status(minScore),signalRating,gap:entry.self-signalRating,top,worst:worst.id,hab:w};
}

function ringsSVG(ev){

function spark(vals,color,w,h){

function metricBand(id,key){

}
function trendChart(id,key){
  const m=METRICS[key], hist=S.hist[id], vals=hist.map(e=>e[key]), band=metricBand(id,key);
  const W=340,H=176,L=34,Rr=12,T=22,B=26;
  let lo=Math.min(...vals,band.lo),hi=Math.max(...vals,band.hi);const pad=(hi-lo)*.15||1;lo-=pad;hi+=pad;
  if(key==='mood'){lo=.5;hi=5.5}
  const x=i=>L+i*(W-L-Rr)/(vals.length-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[lo+pad*.5,(lo+hi)/2,hi-pad*.5].map(t=>key==='mood'?Math.round(t):+t.toFixed(m.dp));
  const uniq=[...new Set(key==='mood'?[1,3,5]:ticks)];
  const color=cv(m.sys);

      <rect x="${L}" y="${y(band.hi)}" width="${W-L-Rr}" height="${Math.max(2,y(band.lo)-y(band.hi))}" rx="6" style="fill:${color}" fill-opacity=".1"/>
      <text x="${L+4}" y="${y(band.hi)-5}" font-size="11" style="fill:var(--ink2)">${esc(band.label)}</text>
      <path d="${path}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(vals[last])}" r="4.5" style="fill:${color};stroke:var(--raised)" stroke-width="2"/>

      <g class="hover" style="display:none"><line y1="${T}" y2="${H-B}" style="stroke:rgba(var(--inkrgb),.3)" stroke-dasharray="3 3"/><circle r="5" style="fill:${color};stroke:var(--raised)" stroke-width="2"/></g>
      <rect class="hit" x="${L}" y="0" width="${W-L-Rr}" height="${H-B}" fill="transparent"/>

}
function bindTrends(){
  document.querySelectorAll('.trend').forEach(el=>{
    const svg=el.querySelector('svg'), hit=el.querySelector('.hit'), g=el.querySelector('.hover'), tip=el.querySelector('.tip');
    const key=el.dataset.trend, id=el.dataset.crew, m=METRICS[key], hist=S.hist[id];
    const path=svg.querySelector('path');
    const pts=path.getAttribute('d').split(/[ML]/).filter(Boolean).map(p=>p.split(',').map(Number));
    const move=e=>{
      const r=svg.getBoundingClientRect(), sx=340/r.width, px=(e.clientX-r.left)*sx;
      let i=0,dmin=1e9;pts.forEach((p,j)=>{const d=Math.abs(p[0]-px);if(d<dmin){dmin=d;i=j}});
      g.style.display='';g.querySelector('line').setAttribute('x1',pts[i][0]);g.querySelector('line').setAttribute('x2',pts[i][0]);
      g.querySelector('circle').setAttribute('cx',pts[i][0]);g.querySelector('circle').setAttribute('cy',pts[i][1]);
      tip.textContent=`Day ${hist[i].day}: ${hist[i][key]} ${m.unit}`;const lx=pts[i][0]/sx, cw=r.width;tip.style.left=lx+'px';tip.style.transform=lx>cw-70?'translate(-100%,-115%)':lx<70?'translate(0,-115%)':'translate(-50%,-115%)';tip.style.top=(pts[i][1]/sx)+'px';tip.classList.add('on');
    };
    const out=()=>{g.style.display='none';tip.classList.remove('on')};
    hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);hit.addEventListener('pointerleave',out);
  });
}

  const groups=[['Flight',3,5],['Ground',5,5],['Basal',10,10],['Vivarium',12,12]];
  const W=300,bh=18,max=12;
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${groups.length*44+20}" role="img" aria-label="OSD-466 sample counts by group: Flight 3 wild-type and 5 p21-null, Ground 5 and 5, Basal 10 and 10, Vivarium 12 and 12">
    ${groups.map((g,j)=>{const y=j*44+6;const sx=v=>v/max*(W-96);return `<text x="0" y="${y+14}" font-size="12" style="fill:var(--ink2)">${g[0]}</text>
      <rect x="72" y="${y}" width="${sx(g[1])}" height="${bh-4}" rx="4" style="fill:var(--immune)"/><text x="${77+sx(g[1])}" y="${y+11}" font-size="11" style="fill:var(--ink)">${g[1]}</text>
      <rect x="72" y="${y+bh}" width="${sx(g[2])}" height="${bh-4}" rx="4" style="fill:var(--immune-soft)"/><text x="${77+sx(g[2])}" y="${y+bh+11}" font-size="11" style="fill:var(--ink)">${g[2]}</text>`}).join('')}
    <g transform="translate(72,${groups.length*44+8})"><rect width="10" height="10" rx="3" style="fill:var(--immune)"/><text x="14" y="9" font-size="11" style="fill:var(--ink2)">Wild-type</text><rect x="86" width="10" height="10" rx="3" style="fill:var(--immune-soft)"/><text x="100" y="9" font-size="11" style="fill:var(--ink2)">p21-null</text></g></svg>`;
  return `
  <section class="card" id="stationCard">
    <div class="row between"><div><h2>Station microbes</h2><p class="small muted">Latest swab per module</p></div>${pill(habLevel(w.idx),'Worst '+w.idx)}</div>
    ${stationStrip('select-module')}
    <p class="tiny" style="margin-top:10px">${w.idx>=65?`${esc(w.module)} is high. Lowers every immune score. Clean and re-swab.`:w.idx>=40?`${esc(w.module)} is raised. Adds a watch to every immune score.`:'All modules near the reference.'}</p>
  </section>
  <section class="card" aria-label="Enter swab result">
    <div class="row between"><h3>${esc(h.selected)} swab</h3>${pill(habLevel(i),'Risk '+i)}</div>
    <p class="tiny" style="margin-bottom:6px">Last swabbed ${TODAY-sel.lastSwab===0?'today':(TODAY-sel.lastSwab)+' days ago'}. Simulated values.</p>

    <div class="field"><span class="flabel">Microbe variety</span>${seg('diversity',[['typical','Typical'],['lower','Lower']])}</div>
    <button class="btn btn-primary btn-block" style="margin-top:8px" data-act="log-swab">Log swab for ${esc(h.selected)}</button>
  </section>
  <section class="card" aria-label="Cabin air">

    <div class="stack" style="margin-top:10px">
      <div><h3>ISS air filters and dust (OSD-224)</h3><p class="small muted">Microbes were dominated by <i>Corynebacterium ihumii</i> GD7, variety was lower than in an Earth cleanroom, and more categories of antimicrobial-resistance and virulence genes were found on the ISS. Samples were treated to tell living from dead cells. Tandem's habitat check is modelled on this design: living load, resistance genes and variety, compared with a reference.</p></div>

    </div>

}

  <div class="card stack">
    <div><h3>OSD-224 / GLDS-224: Whole metagenome profiles of particulates from the ISS</h3><p class="small muted">The habitat check is modelled on this study: living-vs-total load (PMA treatment), resistance and virulence genes, and variety compared with a reference. Key numbers are shown on the Habitat screen. DOI 10.26030/07fq-3k09, NCBI PRJNA363053.</p><p class="small"><a href="https://data.nasa.gov/dataset/whole-metagenome-profiles-of-particulates-collected-from-the-international-space-station-c8f80" target="_blank" rel="noopener">data.nasa.gov record</a>, <a href="https://osdr.nasa.gov/bio/repo/data/studies/OSD-224" target="_blank" rel="noopener">OSDR study</a></p></div>
    <div><h3>OSD-466: Microbiome of mice flown on RR-10</h3><p class="small muted">62 samples across flight, ground, basal and vivarium groups. Grounds the gut-to-immune link and the sample-design chart. DOI 10.26030/6axn-0058.</p><p class="small"><a href="https://data.nasa.gov/dataset/microbiome-profiling-of-feces-from-mice-flown-on-the-rr-10-mission" target="_blank" rel="noopener">data.nasa.gov record</a>, <a href="https://osdr.nasa.gov/bio/repo/data/studies/OSD-466" target="_blank" rel="noopener">OSDR study</a></p></div>
  </div>
  <div class="section-title">Published research</div>
  <div class="card stack small">
    <p>Be NA et al. Whole metagenome profiles of particulates collected from the International Space Station. <i>Microbiome</i> 5, 81 (2017). <a href="https://doi.org/10.1186/s40168-017-0292-4" target="_blank" rel="noopener">doi:10.1186/s40168-017-0292-4</a></p>
    <p>Singh NK et al. Succession and persistence of microbial communities and antimicrobial resistance genes associated with ISS environmental surfaces. <i>Microbiome</i> 6, 204 (2018). <a href="https://doi.org/10.1186/s40168-018-0585-2" target="_blank" rel="noopener">doi:10.1186/s40168-018-0585-2</a></p>
    <p>Spaceflight alters host-gut microbiota interactions. <i>npj Biofilms and Microbiomes</i> 10 (2024). <a href="https://doi.org/10.1038/s41522-024-00545-1" target="_blank" rel="noopener">doi:10.1038/s41522-024-00545-1</a></p>
    <p>Bone loss of 1 to 1.5% a month and about two hours of daily exercise, from NASA research as reported in <a href="https://www.discovermagazine.com/the-sciences/how-long-term-space-travel-wears-down-an-astronauts-mind-and-body" target="_blank" rel="noopener">Discover Magazine</a>. NASA's five hazards of spaceflight: gravity, radiation, isolation and confinement, hostile closed environment, distance from Earth. The same article reports that about 70% of astronauts develop spaceflight-associated neuro-ocular syndrome, the basis for the vision-change rule.</p>
  </div>
  <div class="section-title">What is simulated</div>
  <div class="card small muted stack">
    <p>The three crew members, their vitals, wearable feed, dosimeter readings and swab results are invented for this prototype. No real astronaut data is used.</p>
    <p>Score thresholds (for example, a heart rate 15 bpm over your normal, a temperature of 39 °C or 35.8 °C, the 4 mmHg CO₂ watch level, the habitat risk weights), the typical ranges shaded on the trend charts, and the usual daily radiation dose for each mission profile are demo parameters chosen to be plausible. A flight surgeon would set them for real use. The Mars signal delay range (about 4 to 24 minutes one way) follows from the changing Earth-Mars distance.</p>
    <p>The "how to measure" guides and the blood sugar cut-offs (70 and 54 mg/dL low, 180 mg/dL high) are general health guidance written for this prototype, not NASA procedures. Photos stay on the device and are not analysed.</p>
    <p>Everything runs on the device with no network connection, as a spacecraft would need.</p>
  </div>
  <div class="section-title">Who else could use Tandem</div>
  <div class="card small muted stack">
    <p>Any crew far from a doctor in a closed space: polar research stations, offshore platforms, submarines and long voyages, remote mines. The habitat layer also fits hospitals and cleanrooms that already swab for microbes.</p>
    <p>Model: per-crew licences for space agencies and commercial stations, and site licences for Earth analogues. Next steps: live wearable connection, on-board sequencing feeding swab results automatically, flight-surgeon-set thresholds, and more languages.</p>
  </div>
  <button class="btn btn-soft btn-block" style="margin-top:6px" data-act="reset">Reset demo data</button>
  <button class="btn btn-primary btn-block" style="margin-top:10px" data-act="close">Done</button>`);
}
function sheetMission(){
  openSheet(`<h2 id="sheetTitle">Mission profile</h2><p class="small muted">Sets signal delay and usual daily dose.</p>
  <div class="stack" style="margin-top:14px">${Object.entries(MISSIONS).map(([k,m])=>`<button class="btn btn-soft btn-block" style="justify-content:space-between" data-act="set-mission" data-k="${k}" aria-pressed="${S.mission===k}"><span>${m.name}</span><span class="tiny">${S.mission===k?'Selected':'Delay '+m.delayText.split(' (')[0]}</span></button>`).join('')}</div>`);
}

/* ---------- guided tour ---------- */
const TOUR=[
  {go(){SCENARIOS.microbe.run();S.scenario='microbe';S.tab='today'},el:'#heroCard',text:'A swab in Node 3 came back high. Aina\'s immune score drops, and Tandem tells her why and what to do.'},
  {go(){S.tab='today'},el:'#gapCard',text:'Aina says she feels fine, but her signals disagree. Tandem asks her crewmate Mei to take a second look.'},
  {go(){S.tab='habitat'},el:'#stationCard',text:'Every module has its own swab history, compared with a reference modelled on NASA\'s ISS microbiome study, OSD-224.'},
  {go(){SCENARIOS.heart.run();S.scenario='heart';S.tab='body'},el:'#trendCard',text:'Leo\'s resting heart rate has drifted above his own normal, not an Earth average. Tap the line for each day.'},
  {go(){S.tab='today'},el:'#heroCard',text:'Tick the steps, then log and send to the flight surgeon. On a Mars mission the message takes minutes to arrive.'}
];
let tourStep=-1;
function tourShow(){
  const st=TOUR[tourStep];draft=null;st.go();save();render();
  document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));
  const el=$(st.el);if(el){el.classList.add('spot');el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
  const t=$('#tour');
  t.innerHTML=`<p>${esc(st.text)}</p><div class="row between"><span class="tiny" style="color:inherit;opacity:.7">${tourStep+1} of ${TOUR.length}</span><span class="row" style="gap:6px"><button class="btn btn-sm tghost" data-act="tour-end">${tourStep===TOUR.length-1?'Close':'Skip'}</button><button class="btn btn-sm tbtn" data-act="${tourStep===TOUR.length-1?'tour-end':'tour-next'}">${tourStep===TOUR.length-1?'Start using Tandem':'Next'}</button></span></div>`;
  t.classList.add('on');
  setTimeout(()=>{const n=t.querySelector('.tbtn');n&&n.focus({preventScroll:true})},80);
}
function tourEnd(){tourStep=-1;$('#tour').classList.remove('on');document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));S.seenIntro=true;save()}

/* ---------- theme ---------- */
function effectiveTheme(){return S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyTheme(){
  const t=effectiveTheme();document.documentElement.setAttribute('data-theme',t);
  const b=$('#themeBtn');b.innerHTML=t==='dark'?icons.sun:icons.moon;b.setAttribute('aria-label',t==='dark'?'Switch to day cabin (light)':'Switch to night cabin (dark)');
}

/* ---------- render ---------- */
function render(focus){
  $('#missionBtn').textContent=MISSIONS[S.mission].short+', day '+TODAY;
  $('#crew').innerHTML=CREW.map(c=>{const ev=evaluate(c.id,today(c.id));return `<button class="chipcrew" data-act="crew" data-k="${c.id}" aria-pressed="${S.crew===c.id}"><span class="av" style="background:${c.color}">${c.init}</span>${c.first}<span class="dot" style="background:var(--${ev.status})" aria-label="${STATUS_WORD[ev.status]}"></span></button>`}).join('');
  $('#tabbar').innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-k="${k}" ${S.tab===k?'aria-current="page"':''}>${icons[k]}<span>${l}</span></button>`).join('');
  const v={today:viewToday,checkin:viewCheckin,body:viewBody,habitat:viewHabitat,log:viewLog}[S.tab]||viewToday;
  const h1={checkin:'Morning check-in',body:'Body systems and trends',habitat:'Habitat and cabin microbes',log:'Health log'}[S.tab];
  $('#main').innerHTML=(h1?`<h1 class="sr-only">${h1}</h1>`:'')+v();
  if(S.tab==='today')animateRings();
  if(S.tab==='body')bindTrends();
  if(focus)$('#main').focus({preventScroll:true});
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1600)}
function go(tab){S.tab=tab;save();render(true);window.scrollTo({top:0,behavior:'smooth'})}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, k=b.dataset.k;
  switch(a){
    case 'tab':go(k);break;
    case 'go-today':closeSheet();go('today');break;
    case 'go-checkin':go('checkin');break;
    case 'go-habitat':go('habitat');break;
    case 'swab-due':S.hab.selected=k;save();go('habitat');break;
    case 'skip':ev.preventDefault();$('#main').focus();break;
    case 'go-body':go('body');break;
    case 'crew':S.crew=k;draft=null;save();render();break;
    case 'open-crew':S.crew=k;draft=null;closeSheet();go('today');break;
    case 'overview':sheetOverview();break;
    case 'mission':sheetMission();break;
    case 'set-mission':S.mission=k;CREW.forEach(c=>{today(c.id).dose=MISSIONS[k].dose});draft=null;save();closeSheet();render();toast(MISSIONS[k].name);break;
    case 'theme':S.theme=effectiveTheme()==='dark'?'light':'dark';save();applyTheme();toast(S.theme==='dark'?'Night cabin':'Day cabin');break;
    case 'sources':sheetSources();break;
    case 'close':closeSheet();break;
    case 'intro-skip':S.seenIntro=true;save();closeSheet();break;
    case 'tour-start':S.seenIntro=true;closeSheet();tourStep=0;tourShow();break;
    case 'tour-next':tourStep++;tourShow();break;
    case 'tour-end':tourEnd();break;
    case 'scenario':SCENARIOS[k].run();S.scenario=k;draft=null;save();render();toast(SCENARIOS[k].name);window.scrollTo({top:0,behavior:'smooth'});break;
    case 'action':sheetAction(b.dataset.code);break;
    case 'step':{const key=S.crew+':'+b.dataset.code;const arr=S.steps[key]||(S.steps[key]=[]);const i=+b.dataset.i;const at=arr.indexOf(i);at>=0?arr.splice(at,1):arr.push(i);b.setAttribute('aria-checked',at<0);save();break}
    case 'log-action':{const code=b.dataset.code,act=ACTIONS[code],key=S.crew+':'+code,ev2=evaluate(S.crew,today());const send=!!b.dataset.send;
      const eta=send?Date.now()+MISSIONS[S.mission].delayMin*60000:null;
      S.log.push({ts:Date.now(),crew:S.crew,title:act.title,status:ev2.systems[act.sys||ev2.worst].status,steps:(S.steps[key]||[]).length,total:act.steps.length,note:($('#anote')||{}).value||'',eta,photo:send?(today().photo||null):null});
      S.steps[key]=[];save();closeSheet();toast(send?(MISSIONS[S.mission].delayMin>=1?`Sent. Arrives in ${MISSIONS[S.mission].delayMin} min`:'Sent to flight surgeon'):'Logged');go('log');break}
    case 'peer':sheetPeer();break;
    case 'peer-obs':{const i=peerDraft.indexOf(k);if(k==='fine'){peerDraft=i>=0?[]:['fine']}else{peerDraft=peerDraft.filter(x=>x!=='fine');const j=peerDraft.indexOf(k);j>=0?peerDraft.splice(j,1):peerDraft.push(k)}
      document.querySelectorAll('[data-act="peer-obs"]').forEach(t=>t.setAttribute('aria-pressed',peerDraft.includes(t.dataset.k)));break}
    case 'peer-save':{if(!peerDraft.length){toast('Pick at least one');break}today().peer={by:b.dataset.by,obs:peerDraft.slice()};S.log.push({ts:Date.now(),crew:S.crew,title:'Crewmate check by '+crewById(b.dataset.by).first,status:evaluate(S.crew,today()).status,note:peerDraft.map(o=>PEER_OBS.find(p=>p[0]===o)[1]).join(', ')});save();closeSheet();render();toast('Crewmate check saved');break}
    case 'face':draft[k]=+b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'vitd':draft.vitd=b.dataset.v==='1';b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'sym':{const i=draft.symptoms.indexOf(k);i>=0?draft.symptoms.splice(i,1):draft.symptoms.push(k);b.setAttribute('aria-pressed',i<0);break}
    case 'sync':{const bl=baseline(S.hist[S.crew]),r=Math.random,n=()=>(r()-.5)*2;Object.assign(draft,{hr:Math.round(bl.hr+n()*3),hrv:Math.round(bl.hrv+n()*5),sys:Math.round(bl.sys+n()*4),spo2:97,temp:+(36.6+n()*.15).toFixed(1),sleep:+(7+n()*.5).toFixed(1)});render();toast('Wearable synced');break}
    case 'save-checkin':{const t=today();const {crew,peer,...vals}=draft;Object.assign(t,vals,{done:true});draft=null;S.scenario=null;save();toast('Saved. Streak: '+streakText(runLen(S.crew,x=>x.done)));go('today');break}
    case 'sys':openSys=openSys===k?null:k;render();break;
    case 'figure':{openSys=k;render();const el=$('#sys-'+k);if(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});const bt=el.querySelector('.sys');bt&&bt.focus({preventScroll:true})}break}
    case 'guide':sheetGuide(k);break;
    case 'photo-remove':draft.photo=null;render();toast('Photo removed');break;
    case 'metric':S.metric=k;save();render();break;
    case 'table':S.showTable=!S.showTable;save();render();break;
    case 'pick-module':S.hab.selected=k;save();go('habitat');break;
    case 'select-module':S.hab.selected=k;save();render();break;
    case 'hab':{const m=S.hab.modules[S.hab.selected];m[k]=k==='viable'?+b.dataset.v:b.dataset.v;save();render();break}
    case 'log-swab':{const m=S.hab.modules[S.hab.selected];m.lastSwab=TODAY;const i=modIndex(m);S.log.push({ts:Date.now(),crew:S.crew,title:'Habitat swab, '+S.hab.selected,status:habLevel(i),note:'Habitat risk '+i});save();render();toast('Swab logged');break}
    case 'copy-report':{const txt=reportText();const done=()=>toast('Report copied');try{navigator.clipboard.writeText(txt).then(done,()=>showText(txt))}catch(e){showText(txt)}break}
    case 'reset':{const theme=S.theme;S=freshState();S.theme=theme;S.seenIntro=true;draft=null;save();closeSheet();render();toast('Demo data reset');break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target; if(t.type!=='range')return;
  t.style.setProperty('--p',(t.value-t.min)/(t.max-t.min)*100+'%');
  if(t.dataset.k){const v=+t.value;draft[t.dataset.k]=t.step.includes('.')?+v.toFixed(2):v;$('#o-'+t.dataset.k).textContent=draft[t.dataset.k]+t.dataset.unit}
  if(t.dataset.hab){S.hab.co2=+(+t.value).toFixed(1);$('#o-co2').textContent=S.hab.co2+' mmHg';save()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(t.id!=='f-photo')return;const f=t.files&&t.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast("That file isn't an image");t.value='';return}
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{try{const sc=Math.min(1,480/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(draft){draft.photo=c.toDataURL('image/jpeg',.6);render();toast('Photo attached')}}catch(e){toast("Couldn't read that photo")}URL.revokeObjectURL(url)};
  img.onerror=()=>{toast("Couldn't read that photo");URL.revokeObjectURL(url)};
  img.src=url;
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g.part')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  if(e.key==='Escape'){if(tourStep>=0)tourEnd();else closeSheet()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)applyTheme()})}catch(e){}
function showText(txt){openSheet(`<h2 id="sheetTitle">Report</h2><p class="small muted">Copy this text to share it.</p><textarea style="min-height:260px;margin-top:10px" readonly>${esc(txt)}</textarea><button class="btn btn-primary btn-block" style="margin-top:12px" data-act="close">Done</button>`)}
function reportText(){
  const lines=[`Tandem crew health report, ${MISSIONS[S.mission].name}, mission day ${TODAY}`,''];
  CREW.forEach(c=>{const ev=evaluate(c.id,today(c.id));lines.push(`${c.name} (${c.role}): ${STATUS_WORD[ev.status]}`);SYS.forEach(s=>lines.push(`  ${s.name}: ${ev.systems[s.id].score} ${STATUS_WORD[ev.systems[s.id].status]}${ev.systems[s.id].reasons[0]?' - '+ev.systems[s.id].reasons[0].text:''}`));if(ev.gap>=2)lines.push(`  Self-read gap: said ${today(c.id).self}/5, signals ${ev.signalRating}/5`);lines.push('')});
  lines.push('Cabin modules:');MODULES.forEach(k=>{const m=S.hab.modules[k];lines.push(`  ${k}: risk ${modIndex(m)}, swabbed day ${m.lastSwab}`)});
  lines.push(`  CO2 ${S.hab.co2} mmHg`,'','Log:');
  S.log.forEach(l=>lines.push(`  ${fmtTime(l.ts)} ${crewById(l.crew).first}: ${l.title}${l.note?' ('+l.note+')':''}`));
  lines.push('','Simulated prototype data. Not a medical device.');
  return lines.join('\n');
}
setInterval(()=>{document.querySelectorAll('[data-eta]').forEach(el=>{if(+el.dataset.eta<=Date.now())el.textContent='Delivered to the flight surgeon'})},1000);
applyTheme();
try{render()}catch(err){S=freshState();S.seenIntro=true;save();render()}
if(!S.seenIntro)sheetWelcome();
})();
</script>
</body>
